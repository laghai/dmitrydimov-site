<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Dmitry Dimov Consulting</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #55585c;
    --accent: #0b5fff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a;
      --fg: #eaeaea;
      --muted: #a6abb3;
      --accent: #6ea8ff;
    }
  }

  * { box-sizing: border-box; }

  html { color-scheme: light dark; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }

  main {
    max-width: 65ch;
    margin: 0 auto;
    padding: 6rem 1.25rem 5rem;
  }

  h1 {
    font-size: 1.5rem;
    margin: 0 0 1.25rem;
  }

  p {
    font-size: 1.05rem;
    color: var(--muted);
    margin: 0 0 1.5rem;
  }

  a {
    color: var(--accent);
  }

  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist.</p>
  <p><a href="/">Return home</a></p>
</main>
</body>
</html>
